<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyPulse LMS — Document-Driven Learning & Exam Platform</title>
    <meta name="description" content="Upload syllabus PDFs, DOCX notes, PPTX lecture slides, and past quizzes. AI extracts topics, builds personalized study roadmaps, generates diagnostic exams, flashcards, and interactive tutor support." />
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            colors: {
              offwhite: '#f7f5f0',
              woody: {
                50: '#fffbeb',
                100: '#fef3c7',
                500: '#b45309',
                600: '#92400e',
                700: '#78350f',
                800: '#581c87',
                900: '#451a03',
              },
              silvery: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#f7f5f0] text-stone-800 font-sans antialiased selection:bg-amber-800 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
